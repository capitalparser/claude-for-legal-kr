<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="540" viewBox="0 0 1160 540" role="img" aria-labelledby="title desc">
  <title id="title">claude-for-legal-kr local MCP architecture</title>
  <desc id="desc">Local MCP clients connect to claude-for-legal-kr, which uses korean-law-mcp and Law.go.kr API to draft a Korean legal review memo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .card-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .card-sub { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .badge { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #075985; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .arrow-label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1160" height="540" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="title">한국 법률검토 로컬 MCP</text>
  <text x="54" y="90" class="subtitle">API 키와 검토 문서는 로컬에 두고, LLM에는 검토 가능한 workflow context만 제공합니다.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="138" width="236" height="168" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="78" y="162" width="72" height="25" rx="12.5" fill="#e0f2fe"/>
    <text x="96" y="180" class="badge">LOCAL</text>
    <text x="78" y="220" class="card-title">로컬 MCP 클라이언트</text>
    <text x="78" y="250" class="card-sub">Codex · Claude Desktop</text>
    <text x="78" y="274" class="card-sub">Claude Code · Cursor · Windsurf</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="352" y="138" width="246" height="168" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <rect x="376" y="162" width="95" height="25" rx="12.5" fill="#dbeafe"/>
    <text x="393" y="180" class="badge">WORKFLOW</text>
    <text x="376" y="220" class="card-title">claude-for-legal-kr</text>
    <text x="376" y="250" class="card-sub">한국 법무 workflow MCP</text>
    <text x="376" y="274" class="card-sub">source status · review gate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="138" width="220" height="168" rx="18" fill="#ffffff" stroke="#bae6fd"/>
    <rect x="684" y="162" width="78" height="25" rx="12.5" fill="#e0f2fe"/>
    <text x="700" y="180" class="badge">SOURCE</text>
    <text x="684" y="220" class="card-title">korean-law-mcp</text>
    <text x="684" y="250" class="card-sub">법령 검색 · 조문 조회</text>
    <text x="684" y="274" class="card-sub">MST · article text</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="942" y="138" width="164" height="168" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <rect x="966" y="162" width="54" height="25" rx="12.5" fill="#dcfce7"/>
    <text x="981" y="180" class="badge" fill="#166534">API</text>
    <text x="966" y="220" class="card-title">법제처 API</text>
    <text x="966" y="250" class="card-sub">공식 법령 근거</text>
    <text x="966" y="274" class="card-sub">LAW_OC는 로컬 env</text>
  </g>

  <path d="M 300 222 L 342 222" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 608 222 L 650 222" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 890 222 L 932 222" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="309" y="203" class="arrow-label">tools/call</text>
  <text x="617" y="203" class="arrow-label">lookup</text>
  <text x="898" y="203" class="arrow-label">official</text>

  <g filter="url(#shadow)">
    <rect x="210" y="368" width="740" height="104" rx="18" fill="#111827"/>
    <text x="248" y="406" class="card-title" fill="#ffffff">법률검토 내역서 초안</text>
    <text x="248" y="437" class="card-sub" fill="#d1d5db">검토 결론 · 관련 법령 및 확인 근거 · 주요 쟁점 · 필수 보완사항 · 법무팀/변호사 질문</text>
    <text x="248" y="462" class="small" fill="#93c5fd">법률자문 아님 · 외부 제출/계약 체결 전 전문가 검토 필요</text>
  </g>

  <path d="M 475 316 C 475 344 580 340 580 360" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 770 316 C 770 344 580 340 580 360" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
